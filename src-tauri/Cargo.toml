[package]
name = "nonthub"
version = "0.4.4"
description = "NontHub native shell for Windows and Android"
homepage = "https://www.nont.me"
authors = ["Void"]
edition = "2021"

[lib]
name = "nonthub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "time", "sync"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.4"
dirs = "6"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-opener = "2"
